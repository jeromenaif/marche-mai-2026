<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>GR 223 — Mai 2026 · Carnet de marche</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <style>
    :root {
      --paper: #f4eee2;
      --paper-2: #ece4d2;
      --paper-3: #e0d6bd;
      --card: #fbf7ec;
      --card-2: #f8f2e2;
      --ink: #14110c;
      --ink-2: #3a342a;
      --mute: #8a8170;
      --mute-2: #b3a991;
      --rule: #ddd0b6;
      --rule-soft: rgba(20, 17, 12, 0.08);

      --serif: "Instrument Serif", "Cormorant Garamond", serif;
      --sans: "Manrope", system-ui, sans-serif;

      --shadow-card: 0 1px 0 rgba(20,17,12,0.04),
                     0 20px 50px -30px rgba(20,17,12,0.32),
                     0 6px 18px -12px rgba(20,17,12,0.15);
      --shadow-soft: 0 8px 28px -14px rgba(20,17,12,0.25);

      --container: 1280px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; }
    .muted { color: var(--mute); }

    .glyph { color: var(--day-color, currentColor); font-style: italic; padding-right: 2px; }
    .glyph.down { opacity: 0.55; }

    /* ============ HERO ============ */
    .hero {
      max-width: var(--container);
      margin: 0 auto;
      padding: 80px 40px 60px;
      position: relative;
    }
    .hero-top {
      text-align: center;
      margin-bottom: 56px;
    }
    .hero-eyebrow {
      font: 600 12px/1 var(--sans);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--mute);
      margin-bottom: 24px;
    }
    .hero-title {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 112px;
      line-height: 0.92;
      letter-spacing: -0.025em;
      color: var(--ink);
      margin: 0;
    }
    .hero-subtitle {
      font-family: var(--serif);
      font-style: italic;
      font-size: 28px;
      color: var(--ink-2);
      margin-top: 10px;
      letter-spacing: -0.01em;
    }
    .hero-lede {
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink-2);
      max-width: 560px;
      margin: 28px auto 0;
      text-wrap: balance;
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-bottom: 48px;
      padding: 32px 0;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
    }
    .hstat { text-align: center; }
    .hstat-num {
      font-family: var(--serif);
      font-size: 48px;
      line-height: 1;
      color: var(--ink);
      letter-spacing: -0.015em;
      font-variant-numeric: tabular-nums;
    }
    .hstat-lbl {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--mute);
      margin-top: 10px;
      font-weight: 600;
    }
    .hstat-sub {
      font-size: 12px;
      color: var(--ink-2);
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
    }

    .hero-map-wrap {
      position: relative;
      margin-bottom: 36px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--rule-soft);
    }
    #overview-map {
      width: 100%;
      height: 520px;
      background: var(--paper-2);
    }
    .hero-map-legend {
      position: absolute;
      left: 18px; bottom: 18px;
      background: rgba(251, 247, 236, 0.94);
      backdrop-filter: blur(6px);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex; flex-wrap: wrap; gap: 6px 10px;
      max-width: calc(100% - 36px);
      box-shadow: var(--shadow-soft);
    }
    .leg-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--ink-2);
      text-decoration: none;
      padding: 4px 8px;
      border-radius: 999px;
      transition: background 0.12s;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }
    .leg-item:hover { background: var(--paper-2); }
    .leg-item.off { opacity: 0.45; pointer-events: none; }
    .leg-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--day-color);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.06);
    }
    .map-empty {
      display: flex; align-items: center; justify-content: center;
      height: 100%;
      color: var(--mute);
      font-style: italic;
    }

    .hero-elev {
      background: var(--card);
      border-radius: 18px;
      padding: 22px 24px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--rule-soft);
      margin-bottom: 36px;
    }
    .elev-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }
    .elev-title {
      font-family: var(--serif);
      font-size: 22px;
      color: var(--ink);
    }
    .elev-meta {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mute);
      font-weight: 600;
    }
    #global-elev { width: 100%; }
    .global-elev-svg {
      width: 100%;
      height: 220px;
      display: block;
    }
    .global-elev-svg .grid { stroke: var(--rule-soft); stroke-width: 1; shape-rendering: crispEdges; }
    .global-elev-svg .tick {
      font: 400 10px var(--sans);
      fill: var(--mute);
      text-anchor: middle;
      font-variant-numeric: tabular-nums;
    }
    .global-elev-svg .tick.ytick { text-anchor: end; }
    .global-elev-svg .elev-line {
      fill: none;
      stroke-width: 1.5;
      stroke-linejoin: round;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }
    .global-elev-svg .day-bound {
      stroke: var(--mute-2);
      stroke-width: 1;
      stroke-dasharray: 2 3;
      vector-effect: non-scaling-stroke;
    }
    .global-elev-svg .day-tag {
      font: 600 10px var(--sans);
      text-anchor: middle;
      letter-spacing: 0.05em;
    }
    .global-elev-svg .x-tick-line {
      stroke: var(--mute); stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }
    .elev-empty {
      padding: 60px 20px;
      text-align: center;
      color: var(--mute);
      font-style: italic;
    }

    .hero-scrollhint {
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--mute);
      padding: 24px 0;
      animation: bob 2s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); opacity: 0.7; }
      50% { transform: translateY(4px); opacity: 1; }
    }

    /* ============ DAY SECTIONS ============ */
    #days {
      max-width: var(--container);
      margin: 0 auto;
      padding: 0 40px 80px;
    }

    .day {
      padding: 64px 0;
      position: relative;
    }
    .day-rule {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--day-color, var(--rule)) 12%, var(--day-color, var(--rule)) 88%, transparent);
      opacity: 0.35;
      margin-bottom: 56px;
    }
    .day:first-child .day-rule { display: none; }
    .day-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 40px;
      align-items: start;
    }

    /* Day meta column (left) */
    .day-meta { position: sticky; top: 28px; }
    .day-numwrap {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 18px;
    }
    .day-eyebrow {
      font: 600 11px/1 var(--sans);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--mute);
      margin-bottom: 8px;
    }
    .day-num {
      font-family: var(--serif);
      font-size: 144px;
      line-height: 0.82;
      letter-spacing: -0.04em;
      color: var(--day-color);
      font-variant-numeric: tabular-nums;
      transition: color 0.2s;
    }
    .day.is-pending .day-num { color: var(--mute-2); }
    .day-titles {
      max-width: 240px;
    }
    .day-date {
      font-size: 13px;
      color: var(--ink-2);
      letter-spacing: 0.02em;
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .day-weather {
      font-size: 16px;
      filter: saturate(1.1);
    }
    .day-route {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 30px;
      line-height: 1.05;
      letter-spacing: -0.015em;
      color: var(--ink);
      margin: 0 0 8px;
      text-wrap: balance;
    }
    .day-route .route-arrow {
      color: var(--day-color);
      font-style: italic;
      padding: 0 2px;
    }
    .day-weather-note {
      font-size: 12px;
      color: var(--mute);
      font-style: italic;
      margin-top: 6px;
    }

    /* Day content column (right) */
    .day-content {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .day-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px 28px;
      padding: 22px 28px;
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--rule-soft);
    }
    .dstat-num {
      font-family: var(--serif);
      font-size: 28px;
      line-height: 1;
      letter-spacing: -0.01em;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .dstat-lbl {
      font-size: 10.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mute);
      font-weight: 600;
      margin-top: 8px;
    }
    .dstat-sub {
      text-transform: none;
      letter-spacing: normal;
      color: var(--ink-2);
      font-weight: 400;
      font-size: 11px;
    }

    .day-mapwrap {
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--rule-soft);
      background: var(--paper-2);
    }
    .day-map {
      width: 100%;
      height: 420px;
    }

    .day-photos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 8px;
    }
    .dp-thumb {
      position: relative;
      aspect-ratio: 4 / 3;
      border: none;
      padding: 0;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      background-size: cover;
      background-position: center;
      box-shadow: 0 0 0 1px var(--rule-soft);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .dp-thumb:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 0 1px var(--rule), 0 12px 26px -10px rgba(20,17,12,0.35);
    }
    .dp-num {
      position: absolute; top: 8px; left: 8px;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: rgba(20,17,12,0.78);
      color: var(--paper);
      font: 600 11px/22px var(--sans);
      text-align: center;
      backdrop-filter: blur(4px);
    }
    .dp-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 24px 10px 8px;
      font-size: 11px;
      color: #fff;
      background: linear-gradient(transparent, rgba(0,0,0,0.66));
      text-align: left;
      letter-spacing: 0.01em;
      line-height: 1.3;
    }

    /* Pending state */
    .pending-card {
      background: var(--card-2);
      border-radius: 14px;
      padding: 56px 32px;
      text-align: center;
      border: 1px dashed var(--rule);
      box-shadow: none;
      color: var(--mute);
    }
    .pending-icon {
      color: var(--mute-2);
      margin-bottom: 14px;
      opacity: 0.8;
    }
    .pending-title {
      font-family: var(--serif);
      font-size: 22px;
      color: var(--ink-2);
      margin-bottom: 6px;
    }
    .pending-note {
      font-size: 13px;
      color: var(--mute);
      max-width: 360px;
      margin: 0 auto;
      line-height: 1.45;
    }

    /* ============ LEAFLET DRESSING ============ */
    .leaflet-container { font-family: var(--sans); background: var(--paper-2); }
    .leaflet-tile-pane { filter: saturate(0.82) contrast(0.97) sepia(0.06); }
    .leaflet-control-attribution {
      background: rgba(251, 247, 236, 0.86) !important;
      color: var(--mute) !important;
      font: 400 9.5px/1.4 var(--sans) !important;
      padding: 3px 7px !important;
      border-radius: 6px 0 0 0;
    }
    .leaflet-control-attribution a { color: var(--ink-2) !important; }
    .leaflet-control-zoom {
      border: none !important;
      border-radius: 10px !important;
      overflow: hidden;
      box-shadow: var(--shadow-soft);
      margin: 12px 12px 0 0 !important;
    }
    .leaflet-control-zoom a {
      background: var(--card) !important;
      color: var(--ink) !important;
      width: 30px !important; height: 30px !important; line-height: 30px !important;
      font-size: 15px !important;
      border-bottom: 1px solid var(--rule-soft) !important;
    }
    .leaflet-control-zoom a:last-child { border-bottom: none !important; }

    .pin-wrap, .km-wrap, .photo-wrap, .ov-badge-wrap {
      background: transparent !important;
      border: none !important;
    }
    .pin {
      width: 16px; height: 16px;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      background: #fff;
      display: flex; align-items: center; justify-content: center;
    }
    .pin span {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--day-color, #5a7a3e);
    }
    .pin.start { box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
    .pin.start span { background: #5a7a3e; }
    .pin.end span { background: #c25144; }

    .km {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--card);
      color: var(--ink-2);
      font: 500 10px/22px var(--sans);
      text-align: center;
      box-shadow: 0 0 0 1px var(--rule-soft), 0 3px 8px -3px rgba(20,17,12,0.3);
      font-variant-numeric: tabular-nums;
    }

    .photo-wrap { cursor: grab; }
    .photo-wrap:active { cursor: grabbing; }
    .photo-pin {
      position: relative;
      width: 40px; height: 40px;
      transition: transform 0.18s cubic-bezier(.2,.7,.2,1);
    }
    .photo-pin:hover { transform: scale(1.18) translateY(-3px); z-index: 999; }
    .photo-pin-inner {
      position: absolute; inset: 0;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      box-shadow:
        0 0 0 2.5px var(--card),
        0 0 0 3.5px var(--day-color, rgba(20,17,12,0.28)),
        0 6px 14px -4px rgba(20,17,12,0.45);
    }
    .photo-pin-num {
      position: absolute;
      right: -2px; top: -2px;
      width: 17px; height: 17px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--paper);
      font: 600 9.5px/17px var(--sans);
      text-align: center;
      box-shadow: 0 0 0 2px var(--card);
    }

    .ov-badge {
      width: 28px; height: 28px;
      border-radius: 50%;
      color: #fff;
      font: 700 13px/28px var(--sans);
      text-align: center;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.85), 0 4px 10px -2px rgba(20,17,12,0.4);
      font-variant-numeric: tabular-nums;
    }

    /* ============ FOOTER ============ */
    .trek-foot {
      max-width: var(--container);
      margin: 0 auto;
      padding: 40px 40px 80px;
      text-align: center;
    }
    .foot-line {
      width: 60px; height: 1px;
      background: var(--rule);
      margin: 0 auto 18px;
    }
    .foot-text {
      font-family: var(--serif);
      font-style: italic;
      font-size: 16px;
      color: var(--mute);
    }

    /* ============ STATUS / LOADING ============ */
    #status {
      position: fixed; left: 50%; top: 36px;
      transform: translateX(-50%);
      background: var(--card);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 12px; color: var(--ink-2);
      box-shadow: var(--shadow-card);
      z-index: 100;
      transition: opacity 0.4s;
      letter-spacing: 0.04em;
    }
    body.ready #status { opacity: 0; pointer-events: none; }
    #status:empty { display: none; }

    /* ============ LIGHTBOX ============ */
    #lightbox {
      position: fixed; inset: 0;
      z-index: 200;
      display: none;
      align-items: center; justify-content: center;
    }
    #lightbox.open { display: flex; animation: lb-in 0.2s ease-out; }
    @keyframes lb-in { from { opacity: 0; } to { opacity: 1; } }
    #lb-backdrop {
      position: absolute; inset: 0;
      background: rgba(15, 13, 9, 0.9);
      backdrop-filter: blur(10px);
    }
    #lb-figure {
      position: relative; z-index: 1;
      margin: 0;
      max-width: 90vw; max-height: 90vh;
      display: flex; flex-direction: column;
      gap: 14px; align-items: center;
    }
    #lb-img {
      max-width: 90vw; max-height: 78vh;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6);
    }
    #lb-figure figcaption { text-align: center; color: var(--paper); }
    #lb-caption {
      font-family: var(--serif);
      font-size: 24px;
      line-height: 1.2;
    }
    #lb-meta {
      font-size: 11.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(243, 236, 224, 0.65);
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
    }
    #lb-close, #lb-prev, #lb-next {
      position: absolute; z-index: 2;
      background: rgba(251, 247, 236, 0.1);
      color: var(--paper);
      border: 1px solid rgba(251, 247, 236, 0.18);
      backdrop-filter: blur(8px);
      cursor: pointer;
      font: 400 22px/1 var(--serif);
      width: 48px; height: 48px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, transform 0.15s;
    }
    #lb-close { top: 24px; right: 24px; font-size: 16px; }
    #lb-prev { left: 24px; top: 50%; transform: translateY(-50%); }
    #lb-next { right: 24px; top: 50%; transform: translateY(-50%); }
    #lb-close:hover, #lb-prev:hover, #lb-next:hover {
      background: rgba(251, 247, 236, 0.2);
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 1080px) {
      .hero-title { font-size: 84px; }
      .day-grid { grid-template-columns: 220px 1fr; gap: 28px; }
      .day-num { font-size: 112px; }
    }
    @media (max-width: 820px) {
      .hero { padding: 56px 22px 40px; }
      .hero-title { font-size: 60px; }
      .hero-subtitle { font-size: 22px; }
      .hero-stats { grid-template-columns: 1fr; gap: 22px; }
      #overview-map { height: 380px; }
      #days { padding: 0 22px 60px; }
      .day { padding: 40px 0; }
      .day-grid { grid-template-columns: 1fr; gap: 24px; }
      .day-meta { position: static; }
      .day-numwrap { flex-direction: row; align-items: baseline; gap: 14px; }
      .day-eyebrow { margin: 0; }
      .day-num { font-size: 64px; }
      .day-route { font-size: 24px; }
      .day-stats { grid-template-columns: 1fr 1fr; gap: 16px 18px; padding: 18px; }
      .day-map { height: 320px; }
      .day-rule { margin-bottom: 32px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="status">Chargement…</div>

  <div id="lightbox" aria-hidden="true">
    <div id="lb-backdrop"></div>
    <button id="lb-close" aria-label="Fermer">✕</button>
    <button id="lb-prev" aria-label="Précédent">‹</button>
    <button id="lb-next" aria-label="Suivant">›</button>
    <figure id="lb-figure">
      <img id="lb-img" alt="">
      <figcaption>
        <div id="lb-caption"></div>
        <div id="lb-meta"></div>
      </figcaption>
    </figure>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="gpx.js"></script>
  <script src="days.js"></script>
  <script src="app.js"></script>
</body>
</html>
